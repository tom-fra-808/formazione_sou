---
- name: Configurazione access
  hosts: server

  vars:
    utenti_whitelist:
      - vagrant
      - mario
      - anna

  tasks:
    - name: Genero il file dal template
      ansible.builtin.template:
        src: templates/access.j2
        dest: /tmp/access_output.txt
      delegate_to: localhost

    - name: Inserisco la whitelist prima del blocco generale
      become: true
      ansible.builtin.blockinfile:
        path: /etc/security/access.conf
        block: "{{ lookup('ansible.builtin.file', '/tmp/access_output.txt') }}"
        insertbefore: '^- : ALL : ALL$'